<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>七夕快乐</title>
<meta name="theme-color" content="#000000">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage { position: fixed; inset: 0; }
  #cv { display: block; width: 100%; height: 100%; }

  .cap {
    position: fixed; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom));
    text-align: center; pointer-events: none;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    opacity: 0; transition: opacity 1.2s ease;
  }
  .cap.show { opacity: 1; }
  .cap .t { font-size: 26px; letter-spacing: .34em; color: #f6ece9;
            text-shadow: 0 2px 24px rgba(0,0,0,.85); }
  .cap .n { margin-top: 10px; font-size: 16px; letter-spacing: .30em; color: #d8a79b;
            text-shadow: 0 2px 20px rgba(0,0,0,.85); }
  .cap .s { margin-top: 12px; font-size: 12px; letter-spacing: .22em; color: rgba(228,214,210,.62); }

  #gate {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #000; cursor: pointer; z-index: 20;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    transition: opacity .9s ease;
  }
  #gate.gone { opacity: 0; pointer-events: none; }
  #gate .g1 { font-size: 24px; letter-spacing: .42em; color: #f2e7e4; }
  #gate .g2 { font-size: 13px; letter-spacing: .24em; color: rgba(226,208,204,.5); }
  #gate .dot { width: 7px; height: 7px; border-radius: 50%; background: #c8384a;
               margin-top: 8px; animation: bp 1.9s ease-in-out infinite; }
  @keyframes bp { 0%,100% { transform: scale(1); opacity: .55 } 50% { transform: scale(1.5); opacity: 1 } }

  #hint {
    position: fixed; left: 0; right: 0; top: max(22px, env(safe-area-inset-top));
    text-align: center; pointer-events: none; z-index: 5;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 12px; letter-spacing: .20em; color: rgba(226,208,204,.42);
    opacity: 0; transition: opacity 1s ease;
  }
  #hint.show { opacity: 1; }
  #hint.fade { opacity: 0; }
</style>

<div id="stage"><canvas id="cv"></canvas></div>
<div id="hint">按住拖动 · 转一转</div>
<div class="cap" id="cap">
  <div class="t" id="capT"></div>
  <div class="n" id="capN"></div>
  <div class="s" id="capS"></div>
</div>
<div id="gate">
  <div class="g1">点一下，花开</div>
  <div class="g2">一束不会凋谢的玫瑰</div>
  <div class="dot"></div>
</div>

     文案
     ============================================================ */

    name: "徐雪莹",

    subtitle: "一束不会凋谢的玫瑰"

  /* ============================================================
     常量
     ============================================================ */

  // 立体化。照片只有正面，深度靠"轮廓充气"造出来：
  // 离剪影边缘越远的地方鼓得越高，边缘处收到 0，于是剪影被吹成一个有厚度的形体。
  var DEPTH   = 0.46;    // 充气高度（相对花束半宽）。调 0 就退回一张纸片
  var INFL_P  = 0.58;    // 充气曲线指数。越小越"鼓"，越大越"平"

  var BACK_DIM = 0.40;   // 背面壳的亮度（看不见正面纹理，压暗当阴面）

  // 光照。法线由高度场求得，光源固定在世界坐标里，
  // 所以一转动明暗就跟着变——这是让浮雕"看着是 3D"最关键的一项。
  var AMB     = 0.82;    // 环境光。给低了照片本身的暗部会被压死
  var DIF     = 0.42;    // 漫反射
  // 世界坐标：+z 是**远离镜头**（投影用的是 FOV/(FOV+D)），所以"朝向观众"是 -z。
  // 光从左上前方来，z 分量因此是负的。
  var LX = -0.42, LY = 0.60, LZ = -0.68;

  var AZ_LIM  = 0.85;
  var FOV     = 6.4;
  var RISE    = 1.5;        // 汇聚时长
  var BUFDIV  = 1;          // 粒子缓冲降采样档位（1 = 半分辨率再平滑放大）

  var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  var hash = (window.__ROSE_HASH || location.hash || "").toLowerCase();
  var AUTOPLAY = hash.indexOf("play") >= 0;
  var STILL = hash.indexOf("still") >= 0;

  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d", { alpha: false });
  var stage = document.getElementById("stage");
  var gate = document.getElementById("gate");
  var capEl = document.getElementById("cap");
  var hintEl = document.getElementById("hint");
  document.getElementById("capT").textContent = CONFIG.title;
  document.getElementById("capN").textContent = CONFIG.name;
  document.getElementById("capS").textContent = CONFIG.subtitle;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ------------------------------------------------------------
     距离变换：每个前景像素到最近的轮廓有多远。
     两趟 chamfer，够用且是 O(n)。充气高度就是从这个场来的。
     ------------------------------------------------------------ */
  function distanceField(mask, w, h) {
    var INF = 1e9, d = new Float32Array(w * h), i, x, y, v;
    for (i = 0; i < w * h; i++) d[i] = mask[i] ? INF : 0;
    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) {
        i = y * w + x; v = d[i];
        if (v === 0) continue;
        if (x > 0) { if (d[i - 1] + 1 < v) v = d[i - 1] + 1; }
        if (y > 0) { if (d[i - w] + 1 < v) v = d[i - w] + 1; }
        if (x > 0 && y > 0) { if (d[i - w - 1] + 1.4142 < v) v = d[i - w - 1] + 1.4142; }
        if (x < w - 1 && y > 0) { if (d[i - w + 1] + 1.4142 < v) v = d[i - w + 1] + 1.4142; }
        d[i] = v;
      }
    }
    for (y = h - 1; y >= 0; y--) {
      for (x = w - 1; x >= 0; x--) {
        i = y * w + x; v = d[i];
        if (v === 0) continue;
        if (x < w - 1) { if (d[i + 1] + 1 < v) v = d[i + 1] + 1; }
        if (y < h - 1) { if (d[i + w] + 1 < v) v = d[i + w] + 1; }
        if (x < w - 1 && y < h - 1) { if (d[i + w + 1] + 1.4142 < v) v = d[i + w + 1] + 1.4142; }
        if (x > 0 && y < h - 1) { if (d[i + w - 1] + 1.4142 < v) v = d[i + w - 1] + 1.4142; }
        d[i] = v;
      }
    }
    return d;
  }

  function blur(src, w, h, r) {
    var tmp = new Float32Array(w * h), out = new Float32Array(w * h);
    var x, y, i, s, n, k;
    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) {
        s = 0; n = 0;
        for (k = -r; k <= r; k++) {
          var xx = x + k;
          if (xx < 0 || xx >= w) continue;
          s += src[y * w + xx]; n++;
        }
        tmp[y * w + x] = s / n;
      }
    }
    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) {
        s = 0; n = 0;
        for (k = -r; k <= r; k++) {
          var yy = y + k;
          if (yy < 0 || yy >= h) continue;
          s += tmp[yy * w + x]; n++;

        out[y * w + x] = s / n;
      }
    }

  }

      hf0[i] = DEPTH * Math.pow(dist[i] / dmax, INFL_P) + RELIEF * (lumS[i] - 0.52);
    }
    // 几何用轻磨的高度场；**法线单独用重磨的那份**。
    // 浮雕吃的是照片的高频纹理（纸纤维、花瓣边缘），差分一放大法线就乱跳，
    // 渲出来满屏白麻点。形体的明暗只需要大尺度的坡度，微起伏留在深度里就够了。
    var hf = blur(hf0, w, h, 1);
    var hfN = blur(hf0, w, h, 7);

    var N = budget();
    // 按步长在源图上铺网格取样，一格一颗。
    // 之前是"每个前景像素按概率丢弃"，粒子少于源像素时就会随机留下一片洞。
    var BACK_EVERY = 5;                        // 每 5 格补一颗背面壳。
    // 太稀的话转到侧面、正面壳被剔除的那条边会露出一道麻点
    var step = Math.sqrt(nMask * (1 + 1 / BACK_EVERY) / N);
    if (step < 0.75) step = 0.75;

    var tx = new Float32Array(N), ty = new Float32Array(N), tz = new Float32Array(N);
    var ox = new Float32Array(N), oy = new Float32Array(N), oz = new Float32Array(N);
    var cr = new Uint8Array(N), cg = new Uint8Array(N), cb = new Uint8Array(N);
    var nx = new Float32Array(N), ny = new Float32Array(N), nz = new Float32Array(N);
    var dl = new Float32Array(N);
    var n = 0;
    var rng = mulberry32(20260819);

    function emit(px, py, pz, r, g, b, ax, ay, az) {
      if (n >= N) return;
      tx[n] = px; ty[n] = py; tz[n] = pz;
      cr[n] = r; cg[n] = g; cb[n] = b;
      var nl2 = Math.sqrt(ax * ax + ay * ay + az * az) || 1;
      nx[n] = ax / nl2; ny[n] = ay / nl2; nz[n] = az / nl2;
      // 汇聚：从四周飞进来，越靠外的越晚到
      var rr = Math.sqrt(px * px + py * py);
      dl[n] = 0.05 + rr * 0.75 + rng() * 0.45;
      var a = Math.atan2(py, px) + (rng() - 0.5) * 1.1;
      var far = 1.65 + rng() * 1.05;
      ox[n] = Math.cos(a) * far;
      oy[n] = Math.sin(a) * far;
      oz[n] = (rng() - 0.5) * 1.8;
      n++;
    }

    var gi = 0;
    for (var fy = 1; fy < h - 1; fy += step) {
      for (var fx = 1; fx < w - 1; fx += step) {
        // 格内抖动，免得规则网格在旋转时打出摩尔纹
        var sxf = fx + (rng() - 0.5) * step;
        var syf = fy + (rng() - 0.5) * step;
        x = sxf | 0; y = syf | 0;
        if (x < 1 || x >= w - 1 || y < 1 || y >= h - 1) continue;
        i = y * w + x;
        if (!mask[i]) continue;
        gi++;

        // 法线由高度场的有限差分得到。中心差分在轮廓上会被背景的 0 带偏，
        // 所以只用同为前景的邻居。
        var hx0 = mask[i - 1] ? hfN[i - 1] : hfN[i];
        var hx1 = mask[i + 1] ? hfN[i + 1] : hfN[i];
        var hy0 = mask[i - w] ? hfN[i - w] : hfN[i];
        var hy1 = mask[i + w] ? hfN[i + w] : hfN[i];
        var sxp = (hx1 - hx0) * half * 0.5;
        var syp = (hy1 - hy0) * half * 0.5;

        var R = cd[i * 4], G = cd[i * 4 + 1], B = cd[i * 4 + 2];
        var zf = hf[i];
        var wx = (sxf - cxi) / half, wy = -(syf - cyi) / half;

        // 正面壳：照片本色。朝向观众 = 负 z
        emit(wx, wy, -(zf + (rng() - 0.5) * 0.012), R, G, B, -sxp, syp, -1);

        // 背面壳：同一个剪影往后鼓（正 z），压暗当阴面。
        // 有了它转到侧面才是个有体积的东西，而不是一张纸片。
        if (gi % BACK_EVERY === 0) {
          // 加一点固定偏置：轮廓处 zf→0，两层壳会在那里交汇互抢深度，
          // 渲出来是一圈麻点。偏置保证背面壳始终退在后面。
          emit(wx, wy, zf * BACK_Z + 0.022 + (rng() - 0.5) * 0.012,
               R * BACK_DIM, G * BACK_DIM * 0.96, B * BACK_DIM * 1.06,
               -sxp * BACK_Z, syp * BACK_Z, 1);
        }
      }
    }

    COUNT = n;
    var mxx = 0, mxy = 0;
    for (i = 0; i < n; i++) {
      var axv = tx[i] < 0 ? -tx[i] : tx[i];
      var ayv = ty[i] < 0 ? -ty[i] : ty[i];
      if (axv > mxx) mxx = axv;
      if (ayv > mxy) mxy = ayv;
    }
    // 透视会把靠前的部分放大一点，留 8% 余量
    objHW = mxx * 1.08; objHH = mxy * 1.08;
    return { tx: tx, ty: ty, tz: tz, ox: ox, oy: oy, oz: oz,
             cr: cr, cg: cg, cb: cb, nx: nx, ny: ny, nz: nz, dl: dl };
  }

  /* ============================================================
     画布与缓冲
     ============================================================ */
  var W = 0, H = 0;
  var bcv, bctx, bw, bh, img, u8, zbuf;
  var scale = 1, cx = 0, cy = 0;
  var bgc = null;
  // 点云的实际半宽/半高，建好后回填。取景按它算，不写死系数。
  var objHW = 0.90, objHH = 1.02;

  function fit() {
    var portrait = bh > bw * 1.1;
    // 竖屏底下要留出文案的位置，所以竖向只占六成
    var fw = portrait ? 0.92 : 0.88;
    var fh = portrait ? 0.60 : 0.80;
    scale = Math.min(bw * fw / (2 * objHW), bh * fh / (2 * objHH));
    cx = bw * 0.5;
    cy = bh * (portrait ? 0.44 : 0.50);
  }

  function setupCanvas() {
    var rect = stage.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var vw = Math.max(280, Math.round(rect.width * dpr));
    var vh = Math.max(280, Math.round(rect.height * dpr));
    var capPx = isMobile ? 700000 : 1400000;
    var f = Math.sqrt(capPx / (vw * vh));
    if (f < 1) { vw = Math.round(vw * f); vh = Math.round(vh * f); }
    W = vw; H = vh;
    cv.width = W; cv.height = H;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    bw = Math.max(2, W >> BUFDIV); bh = Math.max(2, H >> BUFDIV);
    bcv = document.createElement("canvas");
    bcv.width = bw; bcv.height = bh;
    bctx = bcv.getContext("2d", { alpha: false });
    img = bctx.createImageData(bw, bh);
    u8 = img.data;
    zbuf = new Float32Array(bw * bh);

    fit();

    bgc = document.createElement("canvas");
    bgc.width = W; bgc.height = H;
    var bg = bgc.getContext("2d");
    var g1 = bg.createRadialGradient(W * 0.5, H * 0.44, 0, W * 0.5, H * 0.44, Math.max(W, H) * 0.72);
    g1.addColorStop(0, "rgba(38,26,30,1)");
    g1.addColorStop(0.55, "rgba(15,11,14,1)");
    g1.addColorStop(1, "rgba(0,0,0,1)");
    bg.fillStyle = g1;
    bg.fillRect(0, 0, W, H);
  }

  /* ============================================================
     交互：拖动旋转 + 惯性；松手后回到轻微自转
     ============================================================ */
  var az = 0, el = 0.06;          // 方位角 / 俯仰角
  var azV = 0, elV = 0;           // 惯性
  var dragging = false, lastX = 0, lastY = 0, lastT = 0;
  var idleAt = 0;                 // 最后一次交互的时间

  function pointerDown(px, py) {
    dragging = true; lastX = px; lastY = py; lastT = performance.now();
    azV = 0; elV = 0;
    hintEl.classList.add("fade");
  }
  function pointerMove(px, py) {
    if (!dragging) return;
    var now = performance.now();
    var dt = Math.max(8, now - lastT);
    var dx = px - lastX, dy = py - lastY;
    var kx = 0.0062, ky = 0.0045;
    // 越界越沉，手感上是被拉住而不是硬停
    var dAz = -dx * kx;
    var over = Math.max(0, Math.abs(az) - AZ_LIM * 0.72) / (AZ_LIM * 0.5);
    if (over > 0) dAz /= (1 + over * 2.4);
    az = clamp(az + dAz, -AZ_LIM * 1.22, AZ_LIM * 1.22);
    el = clamp(el + dy * ky, -0.62, 0.62);
    azV = -dx * kx / dt * 16;
    elV = dy * ky / dt * 16;
    lastX = px; lastY = py; lastT = now;
    idleAt = now;
  }
  function pointerUp() {
    if (!dragging) return;
    dragging = false;
    idleAt = performance.now();
  }

  cv.addEventListener("pointerdown", function (e) {
    cv.setPointerCapture(e.pointerId); pointerDown(e.clientX, e.clientY);
  });
  cv.addEventListener("pointermove", function (e) { pointerMove(e.clientX, e.clientY); });
  cv.addEventListener("pointerup", pointerUp);
  cv.addEventListener("pointercancel", pointerUp);
  window.addEventListener("blur", pointerUp);

  /* ============================================================
     渲染
     ============================================================ */
  var t0 = 0, started = false, t = 0;
  var drawCount = 0;
  var capShown = false;

  function render(now) {
    requestAnimationFrame(render);
    if (!P) return;
    var fs = performance.now();

    if (!started) { t = 0; } else { t = (now - t0) / 1000; }
    if (STILL) t = 6;

    // 惯性衰减；静置后回到缓慢自转 + 左右轻摆
    if (!dragging) {
      az += azV; el = clamp(el + elV, -0.85, 0.85);
      azV *= 0.94; elV *= 0.94;
      if (Math.abs(azV) < 0.00025) azV = 0;
      if (Math.abs(elV) < 0.00025) elV = 0;
      // 超出限位就先弹回来
      if (az > AZ_LIM) az += (AZ_LIM - az) * 0.10;
      else if (az < -AZ_LIM) az += (-AZ_LIM - az) * 0.10;
      var idleFor = (now - idleAt) / 1000;
      if (azV === 0 && idleFor > 1.8 && !STILL) {
        // 静置后慢慢回到正面，再交给下面的轻摆
        var ease = clamp((idleFor - 1.8) / 2.6, 0, 1);
        az += (0 - az) * 0.006 * ease;
        el += (0.05 - el) * 0.006 * ease;
      }
    }

    var swayA = STILL ? 0 : Math.sin(t * 0.24) * SWAY * 0.34;
    var a = az + swayA;
    var e = el;
    var ca = Math.cos(a), sa = Math.sin(a);
    var ce = Math.cos(e), se = Math.sin(e);

    // 光源在世界坐标里固定 → 反过来把它转到物体坐标系比较省
    var llen = Math.sqrt(LX * LX + LY * LY + LZ * LZ) || 1;
    var lx = LX / llen, ly = LY / llen, lz = LZ / llen;

    var i, np = bw * bh;
    for (i = 0; i < np; i++) zbuf[i] = 1e30;
    // 背景填黑（正片会在合成时铺渐变）
    for (i = 0; i < np; i++) {
      var o = i << 2;
      u8[o] = 0; u8[o + 1] = 0; u8[o + 2] = 0; u8[o + 3] = 255;
    }

    var txA = P.tx, tyA = P.ty, tzA = P.tz;
    var oxA = P.ox, oyA = P.oy, ozA = P.oz;
    var crA = P.cr, cgA = P.cg, cbA = P.cb;
    var nxA = P.nx, nyA = P.ny, nzA = P.nz, dlA = P.dl;

    var n = drawCount;
    var bw4 = bw << 2;
    var bwm = bw - 1, bhm = bh - 1;
    var sc = scale;

    for (i = 0; i < n; i++) {
      // 汇聚
      var pr = (t - dlA[i]) / RISE;
      if (pr <= 0) continue;
      var px, py, pz;
      if (pr >= 1) {
        px = txA[i]; py = tyA[i]; pz = tzA[i];
      } else {
        var s2 = pr * pr * (3 - 2 * pr);
        var inv = 1 - s2;
        px = txA[i] * s2 + oxA[i] * inv;
        py = tyA[i] * s2 + oyA[i] * inv;
        pz = tzA[i] * s2 + ozA[i] * inv;
      }

      // 旋转：先绕 Y（方位），再绕 X（俯仰）
      var X = px * ca - pz * sa;
      var Z = px * sa + pz * ca;
      var Y = py * ce + Z * se;
      var D = -py * se + Z * ce;

      var pp = FOV / (FOV + D);
      var fpx = cx + X * pp * sc;
      var fpy = cy - Y * pp * sc;
      var sx = fpx | 0, sy = fpy | 0;
      if (sx < 0 || sx >= bwm || sy < 0 || sy >= bhm) continue;

      var idx = sy * bw + sx;
      if (D >= zbuf[idx]) continue;      // 深度测试：只留最靠前的那颗

      // 法线跟着物体一起转，光源不动 → 一转明暗就变，立体感就出来了
      var ax = nxA[i], ay = nyA[i], az2 = nzA[i];
      var RX = ax * ca - az2 * sa;
      var RZ = ax * sa + az2 * ca;
      var RY = ay * ce + RZ * se;
      var RD = -ay * se + RZ * ce;
      // +z 是远离镜头，所以朝向观众的法线 z 分量是负的。
      // 背面朝向的粒子压暗当阴面，而不是剔掉——剔掉的话侧缘只剩稀疏的
      // 背面壳，会露出一排麻点。方位角限在 66° 内，转不到真正的背后。
      var faceAway = RD > 0.02;
      var nd = RX * lx + RY * ly + RD * lz;
      if (nd < 0) nd = 0;
      var sh = AMB + DIF * nd;
      // 远处稍微压暗，帮着分层
      sh *= 1.06 - 0.16 * clamp((D + 1) / 2, 0, 1);
      if (faceAway) sh *= 0.34;      // 转开的那一面
      if (sh > 1.10) sh = 1.10;      // 封顶，免得亮面被推到纯白炸出麻点

      var vr = crA[i] * sh, vg = cgA[i] * sh, vb = cbA[i] * sh;
      if (vr > 255) vr = 255;
      if (vg > 255) vg = 255;
      if (vb > 255) vb = 255;

      // 一颗写 2x2，填满缝隙；只写单像素会稀成一层椒盐噪点
      var o0 = idx << 2, o1 = o0 + 4, o2 = o0 + bw4, o3 = o2 + 4;
      zbuf[idx] = D;
      u8[o0] = vr; u8[o0 + 1] = vg; u8[o0 + 2] = vb;
      if (D < zbuf[idx + 1]) {
        zbuf[idx + 1] = D;
        u8[o1] = vr; u8[o1 + 1] = vg; u8[o1 + 2] = vb;
      }
      var i2 = idx + bw;
      if (D < zbuf[i2]) {
        zbuf[i2] = D;
        u8[o2] = vr; u8[o2 + 1] = vg; u8[o2 + 2] = vb;
      }
      if (D < zbuf[i2 + 1]) {
        zbuf[i2 + 1] = D;
        u8[o3] = vr; u8[o3 + 1] = vg; u8[o3 + 2] = vb;
      }
    }

    bctx.putImageData(img, 0, 0);

    if (bgc) {
      ctx.globalCompositeOperation = "copy";
      ctx.drawImage(bgc, 0, 0);
      ctx.globalCompositeOperation = "lighter";
      ctx.drawImage(bcv, 0, 0, W, H);
      ctx.globalCompositeOperation = "source-over";
    } else {
      ctx.globalCompositeOperation = "copy";
      ctx.drawImage(bcv, 0, 0, W, H);
    }

    if (!capShown && t > 2.6) {
      capShown = true;
      capEl.classList.add("show");
      hintEl.classList.add("show");
      setTimeout(function () { hintEl.classList.add("fade"); }, 5200);
    }

    // 自适应降档：慢了就砍粒子（数组是洗过牌的，砍尾巴不会整段消失）
    var ms = performance.now() - fs;
    window.__rose = { ms: ms, draw: drawCount, total: COUNT, t: t, az: az, el: el };
    if (ms > 34 && drawCount > COUNT * 0.42) drawCount = (drawCount * 0.94) | 0;
    else if (ms < 15 && drawCount < COUNT) drawCount = Math.min(COUNT, (drawCount * 1.04) | 0 + 600);
  }

  /* ============================================================
     启动
     ============================================================ */
  function shuffle(P2, cnt) {
    // 洗牌，好让自适应降档砍尾巴时是均匀稀释，而不是砍掉一整块区域
    var rng = mulberry32(424242);
    var keys = ["tx","ty","tz","ox","oy","oz","cr","cg","cb","nx","ny","nz","dl"];
    for (var i = cnt - 1; i > 0; i--) {
      var j = (rng() * (i + 1)) | 0;
      for (var k = 0; k < keys.length; k++) {
        var arr = P2[keys[k]];
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
    }
  }

  function begin() {
    if (started) return;
    started = true;
    t0 = performance.now();
    idleAt = t0;
    gate.classList.add("gone");
  }

  window.addEventListener("resize", setupCanvas);
  setupCanvas();

  Promise.all([loadImage(IMG_COLOR), loadImage(IMG_MASK)]).then(function (ims) {
    P = buildCloud(readPixels(ims[0]), readPixels(ims[1]));
    fit();
    shuffle(P, COUNT);
    drawCount = COUNT;
    requestAnimationFrame(render);
    gate.addEventListener("click", begin);
    gate.addEventListener("touchstart", begin, { passive: true });
    if (AUTOPLAY || STILL) begin();
  }).catch(function (err) {
    gate.querySelector(".g1").textContent = "图片没载入";
    gate.querySelector(".g2").textContent = String(err && err.message || err);
  });
})();
</script>
